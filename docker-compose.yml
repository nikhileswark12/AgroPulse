version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    volumes:
      - mongo_data:/data/db
    expose:
      - "27017"
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    expose:
      - "6379"
    restart: unless-stopped

volumes:
  mongo_data:
