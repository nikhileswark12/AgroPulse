<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="description" content="AgroPulse - Smart crop price intelligence and forecasts">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf-token" content="{{ csrf_token() }}">
<title>AgroPulse | Forgot Password</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(to right,#ecfeff,#f0fdf4);
  display:flex;
  align-items:center;
  justify-content:center;
}

.login-container{
  background:white;
  padding:40px;
  width:360px;
  border-radius:14px;
  box-shadow:0 15px 30px rgba(0,0,0,0.15);
}

.logo{
  text-align:center;
  font-size:1.8rem;
  font-weight:bold;
  color:#22c55e;
  margin-bottom:8px;
  cursor:pointer;
}

.subtitle{
  text-align:center;
  color:#64748b;
  margin-bottom:30px;
}

.alert{
  padding:12px;
  margin-bottom:20px;
  border-radius:8px;
  font-size:0.9rem;
  display:none;
}

.alert.error{
  background:#fee2e2;
  color:#dc2626;
  border-left:4px solid #dc2626;
}

.alert.success{
  background:#dcfce7;
  color:#16a34a;
  border-left:4px solid #16a34a;
}

.form-group{
  margin-bottom:18px;
}

.form-group label{
  display:block;
  margin-bottom:6px;
  font-size:0.9rem;
  color:#334155;
}

.form-group input{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid #cbd5e1;
}

.form-group input:focus{
  outline:none;
  border-color:#22c55e;
}

.login-btn{
  width:100%;
  padding:12px;
  background:#22c55e;
  border:none;
  border-radius:8px;
  color:white;
  font-size:1rem;
  font-weight:bold;
  cursor:pointer;
}

.login-btn:disabled{
  background:#94a3b8;
}

.extra-links{
  margin-top:20px;
  text-align:center;
  font-size:0.85rem;
  color:#475569;
}

.extra-links span{
  color:#22c55e;
  font-weight:bold;
  cursor:pointer;
}

.spinner{
  display:inline-block;
  width:14px;
  height:14px;
  border:2px solid rgba(255,255,255,0.3);
  border-top-color:white;
  border-radius:50%;
  animation:spin 0.6s linear infinite;
  margin-right:8px;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}
</style>
</head>

<body>

<div class="login-container">

  <div class="logo" onclick="navigate('/')">AgroPulse</div>
  <div class="subtitle">Reset your password</div>

  <div id="alertBox" class="alert" aria-live="polite"></div>

  <form onsubmit="forgotPassword(event)">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" required>
    </div>

    <button type="submit" class="login-btn" id="submitBtn">Send Reset Link</button>
  </form>

  <div class="extra-links">
    <p><span onclick="navigate('/login')">← Back to Login</span></p>
  </div>

</div>

<script src="/static/js/site.js"></script>
<script>
async function forgotPassword(e){
  e.preventDefault();

  const email = document.getElementById("email").value.trim();
  if(!email){
    showAlert("Email is required", "error");
    return;
  }

  setLoading('submitBtn', true);

  try{
    const res = await fetch('/api/v1/auth/forgot-password', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': document.querySelector('meta[name="csrf-token"]').content
      },
      body: JSON.stringify({ email })
    });

    const data = await res.json();
    showAlert(data.message, data.success ? "success" : "error");
  }catch(err){
    console.error(err);
    showAlert("Server error. Try again.", "error");
  }finally{
    setLoading('submitBtn', false);
  }
}
</script>

</body>
</html>
