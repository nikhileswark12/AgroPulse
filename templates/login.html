<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgroPulse | Login</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(to right,#ecfeff,#f0fdf4);
  display:flex;
  align-items:center;
  justify-content:center;
}

.login-container{
  background:white;
  padding:40px;
  width:360px;
  border-radius:14px;
  box-shadow:0 15px 30px rgba(0,0,0,0.15);
}

.logo{
  text-align:center;
  font-size:1.8rem;
  font-weight:bold;
  color:#22c55e;
  margin-bottom:8px;
  cursor:pointer;
}

.subtitle{
  text-align:center;
  color:#64748b;
  margin-bottom:30px;
}

.alert{
  padding:12px;
  margin-bottom:20px;
  border-radius:8px;
  font-size:0.9rem;
  display:none;
}

.alert.error{
  background:#fee2e2;
  color:#dc2626;
  border-left:4px solid #dc2626;
}

.alert.success{
  background:#dcfce7;
  color:#16a34a;
  border-left:4px solid #16a34a;
}

.form-group{
  margin-bottom:18px;
}

.form-group label{
  display:block;
  margin-bottom:6px;
  font-size:0.9rem;
  color:#334155;
}

.form-group input{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid #cbd5e1;
}

.form-group input:focus{
  outline:none;
  border-color:#22c55e;
}

.login-btn{
  width:100%;
  padding:12px;
  background:#22c55e;
  border:none;
  border-radius:8px;
  color:white;
  font-size:1rem;
  font-weight:bold;
  cursor:pointer;
}

.login-btn:disabled{
  background:#94a3b8;
}

.extra-links{
  margin-top:20px;
  text-align:center;
  font-size:0.85rem;
  color:#475569;
}

.extra-links span{
  color:#22c55e;
  font-weight:bold;
  cursor:pointer;
}

.spinner{
  display:inline-block;
  width:14px;
  height:14px;
  border:2px solid rgba(255,255,255,0.3);
  border-top-color:white;
  border-radius:50%;
  animation:spin 0.6s linear infinite;
  margin-right:8px;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}
</style>
</head>

<body>

<div class="login-container">

  <div class="logo" onclick="navigate('/')">AgroPulse</div>
  <div class="subtitle">Login to your account</div>

  <div id="alertBox" class="alert"></div>

  <form onsubmit="loginUser(event)">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" required>
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" required>
    </div>

    <button type="submit" class="login-btn" id="loginBtn">Login</button>
  </form>

  <div class="extra-links">
    <p>Don't have an account? <span onclick="signup()">Sign up</span></p>
    <p style="margin-top:6px;"><span onclick="navigate('/')">← Back to Home</span></p>
  </div>

</div>

<script>
function navigate(page){
  window.location.href = page;
}

function signup(){
  alert("Signup page coming soon!");
}

function showAlert(msg, type){
  const box = document.getElementById("alertBox");
  box.textContent = msg;
  box.className = `alert ${type}`;
  box.style.display = "block";
  setTimeout(() => box.style.display = "none", 4000);
}

function setLoading(state){
  const btn = document.getElementById("loginBtn");
  btn.disabled = state;
  btn.innerHTML = state
    ? '<span class="spinner"></span>Logging in...'
    : 'Login';
}

async function loginUser(e){
  e.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  if(!email || !password){
    showAlert("Email and password are required", "error");
    return;
  }

  setLoading(true);

  try{
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      credentials: 'include',
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if(data.success){
      showAlert("Login successful! Redirecting...", "success");
      setTimeout(() => {
        window.location.href = '/dashboard';
      }, 1000);
    }else{
      showAlert(data.message || "Invalid credentials", "error");
      setLoading(false);
    }
  }catch(err){
    console.error(err);
    showAlert("Server error. Try again.", "error");
    setLoading(false);
  }
}

/*
🔥 IMPORTANT
NO auth-check on login page.
Auth check must exist ONLY on protected pages.
*/
</script>

</body>
</html>
