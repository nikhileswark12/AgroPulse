<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgroPulse | Reset Password</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(to right,#ecfeff,#f0fdf4);
  display:flex;
  align-items:center;
  justify-content:center;
}

.login-container{
  background:white;
  padding:40px;
  width:360px;
  border-radius:14px;
  box-shadow:0 15px 30px rgba(0,0,0,0.15);
}

.logo{
  text-align:center;
  font-size:1.8rem;
  font-weight:bold;
  color:#22c55e;
  margin-bottom:8px;
  cursor:pointer;
}

.subtitle{
  text-align:center;
  color:#64748b;
  margin-bottom:30px;
}

.alert{
  padding:12px;
  margin-bottom:20px;
  border-radius:8px;
  font-size:0.9rem;
  display:none;
}

.alert.error{
  background:#fee2e2;
  color:#dc2626;
  border-left:4px solid #dc2626;
}

.alert.success{
  background:#dcfce7;
  color:#16a34a;
  border-left:4px solid #16a34a;
}

.form-group{
  margin-bottom:18px;
}

.form-group label{
  display:block;
  margin-bottom:6px;
  font-size:0.9rem;
  color:#334155;
}

.form-group input{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid #cbd5e1;
}

.form-group input:focus{
  outline:none;
  border-color:#22c55e;
}

.login-btn{
  width:100%;
  padding:12px;
  background:#22c55e;
  border:none;
  border-radius:8px;
  color:white;
  font-size:1rem;
  font-weight:bold;
  cursor:pointer;
}

.login-btn:disabled{
  background:#94a3b8;
}

.extra-links{
  margin-top:20px;
  text-align:center;
  font-size:0.85rem;
  color:#475569;
}

.extra-links span{
  color:#22c55e;
  font-weight:bold;
  cursor:pointer;
}

.spinner{
  display:inline-block;
  width:14px;
  height:14px;
  border:2px solid rgba(255,255,255,0.3);
  border-top-color:white;
  border-radius:50%;
  animation:spin 0.6s linear infinite;
  margin-right:8px;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}
</style>
</head>

<body>

<div class="login-container">

  <div class="logo" onclick="navigate('/')">AgroPulse</div>
  <div class="subtitle">Enter new password</div>

  <div id="alertBox" class="alert" aria-live="polite"></div>

  <form id="resetForm" onsubmit="resetPassword(event)">
    <input type="hidden" id="token" value="{{ token }}">
    
    <div class="form-group">
      <label for="new_password">New Password</label>
      <input type="password" id="new_password" required minlength="8">
    </div>

    <div class="form-group">
      <label for="confirm_password">Confirm Password</label>
      <input type="password" id="confirm_password" required minlength="8">
    </div>

    <button type="submit" class="login-btn" id="submitBtn">Update Password</button>
  </form>

  <div class="extra-links">
    <p><span onclick="navigate('/login')">← Back to Login</span></p>
  </div>

</div>

<script src="/static/js/site.js"></script>
<script>
async function resetPassword(e){
  e.preventDefault();

  const token = document.getElementById("token").value;
  const new_password = document.getElementById("new_password").value.trim();
  const confirm_password = document.getElementById("confirm_password").value.trim();

  if(new_password.length < 8){
    showAlert("Password must be at least 8 characters", "error");
    return;
  }

  if(new_password !== confirm_password){
    showAlert("Passwords do not match", "error");
    return;
  }

  setLoading('submitBtn', true);

  try{
    const res = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ token, new_password, confirm_password })
    });

    const data = await res.json();
    
    if (data.success) {
      showAlert(data.message, "success");
      setTimeout(() => {
        window.location.href = '/login?reset=1';
      }, 1500);
    } else {
      showAlert(data.message, "error");
      setLoading('submitBtn', false);
    }
  }catch(err){
    console.error(err);
    showAlert("Server error. Try again.", "error");
    setLoading('submitBtn', false);
  }
}
</script>

</body>
</html>
