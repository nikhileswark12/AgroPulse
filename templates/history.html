<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="description" content="AgroPulse - Smart crop price intelligence and forecasts">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AgroPulse | History</title>
  <link rel="stylesheet" href="/static/css/site.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo" onclick="navigate('/')">AgroPulse</div>
    <div class="nav-links">
      <span onclick="navigate('/')">Home</span>
      <span onclick="navigate('/dashboard')">Dashboard</span>
      <span onclick="navigate('/comparison')">Compare</span>
      <span onclick="navigate('/prediction')">Prediction</span>
      <span onclick="navigate('/about')">About</span>
    </div>
  </nav>

  <div class="container">
    <div class="card">
      <h2>Prediction History</h2>
      <p class="text-muted">Your recent prediction requests will appear here after you log in and generate predictions.</p>
      <div id="historyList">
        <!-- client will populate via /api/v1/predict/history -->
      </div>
    </div>
  </div>

  <footer>© 2026 AgroPulse | Helping Farmers Earn Fair Prices</footer>
  <script src="/static/js/utils.js"></script>
  <script src="/static/js/site.js"></script>
  <script>
    window.ready(async function() {
      const isAuth = await window.checkAuth();
      if (!isAuth) {
        window.location.href = '/login?returnTo=' + encodeURIComponent(window.location.pathname);
      } else {
        loadHistory(1);
      }
    });

    let currentPage = 1;
    let totalPages = 1;

    async function loadHistory(page) {
      try {
        const data = await window.fetchJSON(`/api/v1/predict/history?page=${page}&per_page=5`);
        if (data.success) {
          currentPage = data.page || 1;
          totalPages = data.pages || 1;
          renderHistory(data.data || data.history || []);
          renderPagination();
        }
      } catch (e) {
        console.error(e);
      }
    }

    function renderHistory(items) {
      const container = document.getElementById('historyList');
      if (!items || items.length === 0) {
        container.innerHTML = '<p>No history found.</p>';
        return;
      }
      container.innerHTML = items.map(item => `
        <div class="history-item" style="border: 1px solid #eee; padding: 10px; margin-bottom: 10px; border-radius: 4px;">
          <h4>${item.crop} in ${item.district}, ${item.state}</h4>
          <p><strong>Predicted:</strong> ₹${item.predicted_prices ? item.predicted_prices[0] : 'N/A'}</p>
          <p><strong>Recommendation:</strong> ${item.recommendation || 'N/A'}</p>
          <p><strong>Date:</strong> ${new Date(item.created_at).toLocaleString()}</p>
        </div>
      `).join('');
    }

    function renderPagination() {
      let pagContainer = document.getElementById('paginationControls');
      if (!pagContainer) {
        pagContainer = document.createElement('div');
        pagContainer.id = 'paginationControls';
        pagContainer.style = 'margin-top: 20px; display: flex; justify-content: space-between; align-items: center;';
        document.getElementById('historyList').after(pagContainer);
      }

      pagContainer.innerHTML = `
        <button onclick="loadHistory(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''} style="padding: 5px 10px; cursor: pointer;">Previous</button>
        <span>Page ${currentPage} of ${totalPages}</span>
        <button onclick="loadHistory(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''} style="padding: 5px 10px; cursor: pointer;">Next</button>
      `;
    }
  </script>
</body>
</html>
